name: docboo-backend

services:
  db:
    # Always the latest PostgreSQL (Debian). Caution: when `latest` moves to a new major version,
    # the server starts with an EMPTY cluster in a new /var/lib/postgresql/<major> directory; the old
    # data stays in the previous directory until migrated (pg_dump/restore or pg_upgrade).
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docboo}
      POSTGRES_USER: ${POSTGRES_USER:-docboo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docboo}
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    # Loopback only: lets the API run natively (dotnet run) against this database.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Desktop mode: no pgAdmin login screen. Only acceptable because the port is bound to 127.0.0.1.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  api:
    build:
      context: .
      target: final
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-docboo};Username=${POSTGRES_USER:-docboo};Password=${POSTGRES_PASSWORD:-docboo}
      Api__EnableDocsUi: ${API_ENABLE_DOCS_UI:-true}
      Storage__Root: /data/exports
    volumes:
      - exports:/data/exports
    ports:
      - "${API_PORT:-5248}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres-data:
  pgadmin-data:
  exports:
